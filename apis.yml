aid: playground-global
name: Playground Global
description: >-
  Playground Global is an early-stage deep tech venture capital firm founded in
  2015 by Andy Rubin, Bruce Leak, Matt Hershenson, and Peter Barrett, and
  headquartered at 380 Portage Ave, Palo Alto, California. The firm invests
  "somewhere between improbable and impossible," backing technical founders who
  take large technology risks and build companies from first principles.
  Playground concentrates on four pillars: next-gen compute (quantum computing,
  novel AI chip architectures, advanced interconnects, and semiconductors),
  automation (robotics, supply-chain and industrial automation with tangible
  ROI), energy transition and decarbonization, and engineered biology
  (AI-driven drug discovery, RNA editing, and next-generation therapies). It
  invests at the earliest stages, often at company formation, and operates
  Studio Palo Alto, a lab and prototyping environment for hardware and
  deep-science founders. Reported assets under management are over $1.2 billion
  across its funds. Notable portfolio companies include PsiQuantum, Relativity
  Space, Ultima Genomics, d-Matrix, Velo3D (NYSE), and MosaicML (acquired by
  Databricks).
